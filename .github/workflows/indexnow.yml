name: IndexNow ping

# Every day at 00:20 Pakistan time (19:20 UTC) send that day's new blog posts to Bing via IndexNow.
on:
  schedule:
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "today or all"
        default: "today"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the site to serve today's posts
        run: sleep 60
      - name: Send URLs to IndexNow
        run: python3 scripts/indexnow_ping.py "${{ github.event.inputs.mode || 'today' }}"
